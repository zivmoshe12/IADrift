[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iadrift"
version = "1.0.0"
description = "CSGM- and IAGAN-style inversion of a drifting model for super-resolution x4"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["iadrift"]
